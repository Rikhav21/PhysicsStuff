<!DOCTYPE html>
<html lang = "en">
    <head>
        <link rel ="stylesheet" href ="styles.css"/>
    </head>
    <body>
        <h1>You can change the options at the right of the screen in order to experiment and see what happens!</h1>
        <div class = "simulation">
            <div class= "choices">
                <div id="dataTable" class="data-table">
                    <h3>Data</h3>
                    <table>
                        <tr>
                            <td>Mass (kg):</td>
                            <td id="massValue">50.00</td>
                        </tr>
                        <tr>
                            <td>Force (N):</td>
                            <td id="forceValue">50.00</td>
                        </tr>
                        <tr>
                            <td>Friction (μ):</td>
                            <td id="frictionValue">0.50</td>
                        </tr>
                        <tr>
                            <td>Position (m):</td>
                            <td id="positionValue">0.00</td>
                        </tr>
                        <tr>
                            <td>Velocity (m/s):</td>
                            <td id="velocityValue">0.00</td>
                        </tr>
                        <tr>
                            <td>Acceleration (m/s²):</td>
                            <td id="accelerationValue">0.00</td>
                        </tr>
                    </table>
                </div>
            <div class= "choices-controls">
                <button id="ConstantForce">Constant Force?</button>
                <button  id="Scale">Scale?</button>
                <div class="slide">Mass
                    <div class = "slidecontainer">
                        <input type="range" min="1" max = "100" value="50" class="slider" id="massSlider">
                    </div>
                </div>
                <div class="slide">Force
                    <div class = "slidecontainer">
                        <input type="range" min="1" max = "100" value="50" class="slider" id="forceSlider">
                    </div>
                </div>
                <button  id="Scale">Friction?</button>
                <div class="slide">Coefficient of Friction
                    <div class = "slidecontainer">
                        <input type="range" min="1" max = "100" value="50" class="slider" id="frictionSlider">
                    </div>
                    <div class = "pointers">
                        <div class = "left">0</div>
                        <div class = "middle">0.5</div>
                        <div class = "right">1</div>
                    </div>
                </div>
                <button id = "Start">Start Simulation</button>
                <button id = "Reset">Reset?</button>
                </div>
            </div>
                <canvas id="simCanvas" width="800" height="600"></canvas>
        </div>
    </body>
    <script src="kinematics.js"></script>
</html>
